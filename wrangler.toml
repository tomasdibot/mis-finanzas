# mis-finanzas: one Owner's Deployment. The Worker answers /api/*; everything else is the app in web/.
name = "mis-finanzas"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The Owner's database. No database_id here: Cloudflare creates the database on the first deploy (and the
# "Deploy to Cloudflare" button fills in the id in the Owner's own copy).
[[d1_databases]]
binding = "DB"
database_name = "mis-finanzas"
migrations_dir = "migrations"

# sync with Mercado Pago in small steps (src/sync.js)
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
