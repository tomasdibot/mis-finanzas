# mis-finanzas: one shared app (ADR 0003). Static app in web/ + the Relay under /api/*. No database and no Cron:
# every user's data lives only on their own device. Secrets: MP_CLIENT_ID, MP_CLIENT_SECRET (wrangler secret put).
name = "mis-finanzas"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The Relay keeps nothing, not even request logs.
[observability]
enabled = false
